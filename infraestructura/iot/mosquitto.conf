# ==============================================================================
# Configuración de Eclipse Mosquitto para la Plataforma IoT San Francisco Residuos
# Cátedra: Arquitecturas Móviles - UTN FRSFCO
# ==============================================================================

# Puerto MQTT estándar para dispositivos IoT y nodos sensores (ESP32 / LoRaWAN Bridge)
listener 1883 0.0.0.0
protocol mqtt

# Puerto WebSocket para monitoreo en tiempo real desde la consola Web / PWA
listener 9001 0.0.0.0
protocol websockets

# Persistencia de mensajes en disco para soportar reinicios de pods en Kubernetes
persistence true
persistence_location /mosquitto/data/

# Registro de operaciones y eventos de conexión
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information

# Parámetros de conexión y control de concurrencia
max_connections 1000
max_queued_messages 5000
allow_anonymous true

# Límite de tamaño de paquete (telemetría de contenedores es < 512 bytes)
max_packet_size 4096

