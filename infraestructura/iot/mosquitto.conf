# Intermediario MQTT de los contenedores de San Francisco (Eclipse Mosquitto 2)
#
# Solo conexiones cifradas y con usuario. Los archivos de certificados y contraseñas no están en el
# repositorio: se generan al desplegar (ver el encabezado de infraestructura/k8s/iot-mosquitto.yaml).

# Sensores y servicio de ingesta (MQTT sobre TLS)
listener 8883 0.0.0.0
protocol mqtt
cafile /mosquitto/certs/ca.crt
certfile /mosquitto/certs/servidor.crt
keyfile /mosquitto/certs/servidor.key
tls_version tlsv1.2

# Navegadores (MQTT sobre WebSocket con TLS)
listener 9001 0.0.0.0
protocol websockets
cafile /mosquitto/certs/ca.crt
certfile /mosquitto/certs/servidor.crt
keyfile /mosquitto/certs/servidor.key

# Nadie entra sin usuario; cada usuario solo usa sus canales
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl

# Persistencia para soportar reinicios del pod
persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type error
log_type warning
log_type notice
log_type information

max_connections 1000
max_queued_messages 5000
# Una lectura de un contenedor ocupa menos de 512 bytes
max_packet_size 4096
