apiVersion: apps/v1
kind: Deployment
metadata:
  name: gestion-residuos-web
  namespace: produccion-residuos
  labels:
    app.kubernetes.io/name: gestion-residuos-web
    app.kubernetes.io/instance: produccion
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/component: frontend-api
    app.kubernetes.io/part-of: sistema-residuos-san-francisco
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: gestion-residuos-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gestion-residuos-web
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app.kubernetes.io/name
                      operator: In
                      values:
                        - gestion-residuos-web
                topologyKey: "kubernetes.io/hostname"
      containers:
        - name: web-app
          image: ghcr.io/utn-frsfco/gestion-residuos-sf:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          securityContext:
            readOnlyRootFilesystem: false
            runAsNonRoot: true
            runAsUser: 101
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            successThreshold: 1
            failureThreshold: 2

