# ==============================================================================
# Intermediario MQTT (Eclipse Mosquitto) y servicio de ingesta de los sensores
# Espacio de nombres: produccion-residuos
#
# Antes de aplicar, desde la raíz del repositorio:
#   kubectl create namespace produccion-residuos
#   kubectl -n produccion-residuos create configmap mosquitto-config --from-file=infraestructura/iot/mosquitto.conf
#   kubectl -n produccion-residuos create configmap worker-ingesta-script --from-file=infraestructura/iot/worker_ingesta_mqtt.py
#   kubectl -n produccion-residuos create secret generic firestore-cuenta-servicio --from-file=cuenta-servicio.json=<clave de la cuenta de servicio>
# La cuenta de servicio necesita el rol "Usuario de Cloud Datastore" para escribir la telemetría.
# ==============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mosquitto-broker
  namespace: produccion-residuos
  labels:
    app: mosquitto-broker
    tier: iot-telemetria
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: mosquitto-broker
  template:
    metadata:
      labels:
        app: mosquitto-broker
    spec:
      containers:
        - name: mosquitto
          image: eclipse-mosquitto:2.0.18-openssl
          imagePullPolicy: IfNotPresent
          ports:
            - name: mqtt-tcp
              containerPort: 1883
            - name: mqtt-ws
              containerPort: 9001
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "128Mi"
          volumeMounts:
            - name: config-volume
              mountPath: /mosquitto/config/mosquitto.conf
              subPath: mosquitto.conf
            - name: data-volume
              mountPath: /mosquitto/data
      volumes:
        - name: config-volume
          configMap:
            name: mosquitto-config
        - name: data-volume
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: mosquitto-service
  namespace: produccion-residuos
spec:
  type: ClusterIP
  selector:
    app: mosquitto-broker
  ports:
    - name: mqtt-tcp
      port: 1883
      targetPort: 1883
    - name: mqtt-ws
      port: 9001
      targetPort: 9001
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker-ingesta-iot
  namespace: produccion-residuos
  labels:
    app: worker-ingesta-iot
    tier: procesamiento-eventos
spec:
  replicas: 2
  selector:
    matchLabels:
      app: worker-ingesta-iot
  template:
    metadata:
      labels:
        app: worker-ingesta-iot
    spec:
      containers:
        - name: ingesta-subscriptor
          image: python:3.11-slim
          command: ["sh", "-c", "pip install --no-cache-dir -q paho-mqtt==2.1.0 google-auth==2.35.0 requests==2.32.3 && python /app/worker_ingesta_mqtt.py"]
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "192Mi"
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: BROKER_HOST
              value: "mosquitto-service"
            - name: GOOGLE_APPLICATION_CREDENTIALS
              value: /secretos/cuenta-servicio.json
          volumeMounts:
            - name: script
              mountPath: /app
            - name: credencial
              mountPath: /secretos
              readOnly: true
      volumes:
        - name: script
          configMap:
            name: worker-ingesta-script
        - name: credencial
          secret:
            secretName: firestore-cuenta-servicio
            optional: true
