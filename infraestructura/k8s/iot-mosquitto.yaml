# ==============================================================================
# Intermediario MQTT (Eclipse Mosquitto) y servicio de ingesta de los sensores
# Espacio de nombres: produccion-residuos
#
# Solo acepta conexiones cifradas (TLS) y con usuario. Antes de aplicar, desde la raíz del repositorio:
#   kubectl create namespace produccion-residuos
#   kubectl -n produccion-residuos create configmap mosquitto-config \
#       --from-file=infraestructura/iot/mosquitto.conf --from-file=infraestructura/iot/acl
#   kubectl -n produccion-residuos create configmap worker-ingesta-script --from-file=infraestructura/iot/worker_ingesta_mqtt.py
#   # certificados del intermediario y archivo de contraseñas (mosquitto_passwd) de los usuarios sensores, ingesta y municipio
#   kubectl -n produccion-residuos create secret generic mosquitto-seguridad \
#       --from-file=ca.crt --from-file=servidor.crt --from-file=servidor.key --from-file=passwd \
#       --from-literal=clave-ingesta=<clave del usuario ingesta>
#   # credencial para escribir en Firestore: una cuenta de servicio con el rol "Usuario de Cloud Datastore"
#   kubectl -n produccion-residuos create secret generic firestore-cuenta-servicio --from-file=cuenta-servicio.json=<clave>
# ==============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mosquitto-broker
  namespace: produccion-residuos
  labels:
    app: mosquitto-broker
    tier: iot-telemetria
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: mosquitto-broker
  template:
    metadata:
      labels:
        app: mosquitto-broker
    spec:
      securityContext:
        fsGroup: 1883          # grupo del usuario mosquitto: puede leer los secretos montados
      containers:
        - name: mosquitto
          image: eclipse-mosquitto:2.0.18-openssl
          imagePullPolicy: IfNotPresent
          ports:
            - name: mqtt-tls
              containerPort: 8883
            - name: mqtt-ws
              containerPort: 9001
          readinessProbe:
            tcpSocket:
              port: 8883
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "128Mi"
          volumeMounts:
            - name: config
              mountPath: /mosquitto/config/mosquitto.conf
              subPath: mosquitto.conf
            - name: config
              mountPath: /mosquitto/config/acl
              subPath: acl
            - name: seguridad
              mountPath: /mosquitto/config/passwd
              subPath: passwd
            - name: seguridad
              mountPath: /mosquitto/certs
              readOnly: true
            - name: datos
              mountPath: /mosquitto/data
      volumes:
        - name: config
          configMap:
            name: mosquitto-config
        - name: seguridad
          secret:
            secretName: mosquitto-seguridad
            defaultMode: 0440
        - name: datos
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: mosquitto-service
  namespace: produccion-residuos
spec:
  type: ClusterIP
  selector:
    app: mosquitto-broker
  ports:
    - name: mqtt-tls
      port: 8883
      targetPort: 8883
    - name: mqtt-ws
      port: 9001
      targetPort: 9001
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker-ingesta-iot
  namespace: produccion-residuos
  labels:
    app: worker-ingesta-iot
    tier: procesamiento-eventos
spec:
  replicas: 2
  selector:
    matchLabels:
      app: worker-ingesta-iot
  template:
    metadata:
      labels:
        app: worker-ingesta-iot
    spec:
      containers:
        - name: ingesta-subscriptor
          image: python:3.11-slim
          command: ["sh", "-c", "pip install --no-cache-dir -q paho-mqtt==2.1.0 google-auth==2.35.0 requests==2.32.3 && python /app/worker_ingesta_mqtt.py"]
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "192Mi"
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: BROKER_HOST
              value: "mosquitto-service"
            - name: BROKER_PUERTO
              value: "8883"
            - name: MQTT_CA
              value: /certs/ca.crt
            - name: MQTT_USUARIO
              value: ingesta
            - name: MQTT_CLAVE
              valueFrom:
                secretKeyRef:
                  name: mosquitto-seguridad
                  key: clave-ingesta
            - name: GOOGLE_APPLICATION_CREDENTIALS
              value: /secretos/cuenta-servicio.json
            # Alternativa para pruebas: un token de acceso de corta duración en lugar de la cuenta de servicio
            - name: FIRESTORE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: firestore-token
                  key: token
                  optional: true
          volumeMounts:
            - name: script
              mountPath: /app
            - name: credencial
              mountPath: /secretos
              readOnly: true
            - name: certificados
              mountPath: /certs
              readOnly: true
      volumes:
        - name: script
          configMap:
            name: worker-ingesta-script
        - name: credencial
          secret:
            secretName: firestore-cuenta-servicio
            optional: true
        - name: certificados
          secret:
            secretName: mosquitto-seguridad
            items:
              - key: ca.crt
                path: ca.crt
