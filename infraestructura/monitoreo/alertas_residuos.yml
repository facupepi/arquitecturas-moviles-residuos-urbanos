groups:
  - name: alertas-gestion-residuos
    rules:
      - alert: InstanciaCaida
        expr: nginx_up == 0 or up{job="gestion-residuos-pods"} == 0
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "Una réplica de la aplicación no responde"

      - alert: TraficoElevado
        expr: sum(rate(nginx_http_requests_total[1m])) > 200
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Más de 200 peticiones por segundo sostenidas"
          description: "Si el autoescalado ya está en el máximo de réplicas conviene ampliar el límite."

      - alert: ConexionesSaturadas
        expr: sum(nginx_connections_active) > 400
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Más de 400 conexiones activas al mismo tiempo"

      # Requiere kube-state-metrics en el clúster
      - alert: AutoescaladoEnElMaximo
        expr: kube_deployment_status_replicas_available{deployment="gestion-residuos-web"} >= 10
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "El autoescalado llegó al máximo de 10 réplicas"
