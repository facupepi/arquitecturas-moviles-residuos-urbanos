# Pila de monitoreo local: aplicación + exportador de métricas + Prometheus + Grafana
#   docker compose -f infraestructura/monitoreo/docker-compose.yml up -d --build
# Grafana en http://localhost:3300 (sin clave) y Prometheus en http://localhost:9190
services:
  app:
    build:
      context: ../..
      dockerfile: infraestructura/Dockerfile
    ports:
      - "18081:8080"
  exportador:
    image: nginx/nginx-prometheus-exporter:1.3.0
    command: ["--nginx.scrape-uri=http://127.0.0.1:8080/stub_status"]
    network_mode: "service:app"   # comparte la red de la aplicación: el estado de Nginx solo se sirve a localhost
  prometheus:
    image: prom/prometheus:v2.55.1
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    volumes:
      - ./prometheus-local.yml:/etc/prometheus/prometheus.yml:ro
      - ./alertas_residuos.yml:/etc/prometheus/alertas_residuos.yml:ro
    ports:
      - "9190:9090"
  grafana:
    image: grafana/grafana:11.3.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./grafana/datasource.yml:/etc/grafana/provisioning/datasources/datasource.yml:ro
      - ./grafana/dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro
      - ./grafana-dashboard.json:/var/lib/grafana/dashboards/residuos.json:ro
    ports:
      - "3300:3000"
