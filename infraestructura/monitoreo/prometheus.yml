global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "alertas_residuos.yml"

scrape_configs:
  # Pods de la aplicación: cada uno lleva un exportador de métricas de Nginx en el puerto 9113
  - job_name: 'gestion-residuos-pods'
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names:
            - produccion-residuos
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
        action: keep
        regex: true
      - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
        action: replace
        regex: ([^:]+)(?::\d+)?;(\d+)
        replacement: $1:$2
        target_label: __address__
      - source_labels: [__meta_kubernetes_pod_name]
        action: replace
        target_label: pod
