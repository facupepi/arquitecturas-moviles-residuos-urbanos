server {
    listen 8080;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Compresión gzip para optimizar ancho de banda móvil
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

    # Headers de seguridad globales (OWASP Recommended)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://unpkg.com https://www.gstatic.com https://apis.google.com; style-src 'self' 'unsafe-inline' https://unpkg.com; img-src 'self' data: blob: https://server.arcgisonline.com https://unpkg.com https://*.googleusercontent.com; font-src 'self' data:; connect-src 'self' https://unpkg.com https://router.project-osrm.org https://*.googleapis.com https://*.firebaseio.com wss://*.firebaseio.com https://www.gstatic.com; frame-src https://sf-residuos-urbanos-utn.firebaseapp.com https://accounts.google.com; worker-src 'self'; object-src 'none'; base-uri 'self'" always;

    # Cache de assets estáticos manteniendo headers de seguridad
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://unpkg.com https://www.gstatic.com https://apis.google.com; style-src 'self' 'unsafe-inline' https://unpkg.com; img-src 'self' data: blob: https://server.arcgisonline.com https://unpkg.com https://*.googleusercontent.com; font-src 'self' data:; connect-src 'self' https://unpkg.com https://router.project-osrm.org https://*.googleapis.com https://*.firebaseio.com wss://*.firebaseio.com https://www.gstatic.com; frame-src https://sf-residuos-urbanos-utn.firebaseapp.com https://accounts.google.com; worker-src 'self'; object-src 'none'; base-uri 'self'" always;
    }

    # Soporte SPA: redirección al index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Probes de liveness y readiness
    location /healthz {
        access_log off;
        return 200 "healthy\n";
    }

    # Métricas para Nginx Prometheus Exporter
    location /stub_status {
        stub_status;
        access_log off;
        allow 127.0.0.1;
        deny all;
    }
}

